# Example Nginx site for the admin panel (one per environment).
# Copy to /etc/nginx/sites-available/<site> and security-headers.conf to
# /etc/nginx/snippets/admin-security-headers.conf, adjust server_name and root, then:
#   sudo ln -s /etc/nginx/sites-available/<site> /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# `root` must point at <DEPLOY_PATH>/current, the symlink the deploy workflow switches.
# Add HTTPS with: sudo certbot --nginx -d admin.example.com

server {
    listen 80;
    listen [::]:80;
    server_name admin.example.com;            # staging: staging-admin.example.com

    root /var/www/admin/current;              # = DEPLOY_PATH + /current
    index index.html;

    # Single-page app: unknown paths fall back to index.html so deep links work.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Fingerprinted build assets never change: cache for a year.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include snippets/admin-security-headers.conf;
        access_log off;
    }

    # Always revalidate the HTML shell so new releases are picked up immediately.
    # (add_header in a location replaces the server-level ones, hence the include.)
    location = /index.html {
        add_header Cache-Control "no-cache";
        include snippets/admin-security-headers.conf;
    }

    # Branding files (public/brand) keep their names across saves; cache briefly.
    location /brand/ {
        expires 7d;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    include snippets/admin-security-headers.conf;
}
