name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Reused by the deploy workflows so nothing ships without passing checks.
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Prettier
        run: npm run format:check

      - name: ESLint
        run: npm run lint

      - name: Build (includes typecheck)
        run: npm run build
