name: Deploy Staging

on:
  push:
    branches: [staging-deploy]
  workflow_dispatch:

# One deploy at a time per environment; a newer push waits instead of cancelling a running deploy.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: checks
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
    secrets: inherit
